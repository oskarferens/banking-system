services:
  mysql:
    image: mysql:8.0
    container_name: app-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: banking_db
      MYSQL_USER: ${DB_USER:-banking}
      MYSQL_PASSWORD: ${DB_PASSWORD:-banking}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      # Ping over TCP (-h 127.0.0.1), not via the Unix socket: during initial MySQL setup,
      # a temporary socket only server may start and report healthy too early.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    image: banking-system:local
    container_name: banking-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/banking_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-banking}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-banking}
      # Default is for local demo ONLY. Set your own secret in .env.
      JWT_SECRET: ${JWT_SECRET:-b3f1c9a47d2e86f05a1c7e93d4b2a860e9f4c1d7a3b5086e2d9c4f7a1b3e5d82}
    ports:
      - "8080:8080"
    restart: on-failure:5

volumes:
  mysql-data: